name: SATE-UNIAJC CI Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Diagnosticar carpetas y ejecutar Maven
        run: |
          echo "=== Ubicación actual ==="
          pwd
          echo "=== Archivos en este nivel ==="
          ls -la
          echo "=== Buscando pom.xml ==="
          find . -maxdepth 3 -name "pom.xml"
          
          POM_FILE=$(find . -name "pom.xml" -not -path "*/target/*" | head -n 1)
          if [ -z "$POM_FILE" ]; then
            echo "ERROR: No se encontró ningún pom.xml en el repositorio."
            exit 1
          fi
          
          echo "Ejecutando Maven desde: $POM_FILE"
          mvn clean test -f "$POM_FILE"
