name: SATE-UNIAJC CI Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Buscar pom.xml y compilar
        run: |
          # Busca cualquier archivo llamado pom.xml en el repositorio
          POM_PATH=$(find . -name "pom.xml" | head -n 1)
          
          if [ -z "$POM_PATH" ]; then
            echo "¡Atención! No se encuentra el archivo pom.xml en ninguna carpeta."
            exit 1
          fi
          
          echo "Pom encontrado en: $POM_PATH"
          # Extrae la carpeta donde está el pom para usarla de directorio de trabajo
          DIR_PATH=$(dirname "$POM_PATH")
          
          mvn clean test -f "$POM_PATH"
